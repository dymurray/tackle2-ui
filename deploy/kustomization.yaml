apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # CRDs
  - crds/skillcard.yaml
  - crds/skillcollection.yaml
  - crds/llmprovider.yaml
  - crds/agent.yaml
  - crds/agentplan.yaml
  # RBAC
  - rbac/role.yaml
  - rbac/rolebinding.yaml

# Override the namespace for the service account in the rolebinding.
# Usage: kubectl apply -k deploy/
# To change namespace: kustomize edit set namespace my-namespace
# or patch the rolebinding subject directly.
