apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: maven-dependency-analysis
  namespace: konveyor-tackle
spec:
  type: skill
  description: >
    Analyze Maven pom.xml files to identify javax dependencies that
    need migration to jakarta equivalents. Produces a dependency
    report with recommended version mappings.
  version: "1.0.0"
  tags:
    - migration
    - java
    - maven
  globs:
    - "pom.xml"
    - "**/pom.xml"
  content: |
    # Maven Dependency Analysis

    Analyze all `pom.xml` files in the project to identify dependencies
    using the `javax.*` namespace that must be migrated to `jakarta.*`.

    ## Steps
    1. Parse every `pom.xml` (root and modules)
    2. Identify dependencies with groupId starting with `javax.`
    3. For each, look up the jakarta equivalent and target version
    4. Produce a markdown report listing each dependency, its current
       version, and the recommended jakarta replacement

    ## Known mappings
    | javax groupId | jakarta groupId | Recommended version |
    |---|---|---|
    | javax.servlet:javax.servlet-api | jakarta.servlet:jakarta.servlet-api | 6.0.0 |
    | javax.persistence:javax.persistence-api | jakarta.persistence:jakarta.persistence-api | 3.1.0 |
    | javax.enterprise:cdi-api | jakarta.enterprise:jakarta.enterprise.cdi-api | 4.0.1 |
    | javax.ws.rs:javax.ws.rs-api | jakarta.ws.rs:jakarta.ws.rs-api | 3.1.0 |
    | javax.inject:javax.inject | jakarta.inject:jakarta.inject-api | 2.0.1 |
    | javax.annotation:javax.annotation-api | jakarta.annotation:jakarta.annotation-api | 2.1.1 |
status:
  contentSize: 980
  ready: true
