apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: quarkus-cdi-patterns
  namespace: konveyor-tackle
spec:
  type: skill
  description: >
    Convert Java EE CDI patterns to Quarkus-native equivalents.
    Handles bean discovery, producer methods, interceptors, and
    Quarkus-specific annotations like @ApplicationScoped.
  version: "1.0.0"
  tags:
    - migration
    - java
    - quarkus
    - cdi
  globs:
    - "**/*.java"
  content: |
    # Quarkus CDI Pattern Migration

    Convert Java EE CDI patterns to Quarkus equivalents.

    ## Key changes
    - Add `beans.xml` discovery mode or `@io.quarkus.arc.Unremovable`
      for beans only used via `Instance<>` or reflection
    - Replace `@javax.ejb.Stateless` → remove, use `@ApplicationScoped`
    - Replace `@javax.ejb.Singleton` → `@jakarta.inject.Singleton`
    - Replace EJB `@Schedule` → Quarkus `@io.quarkus.scheduler.Scheduled`
    - Replace `@MessageDriven` → Quarkus SmallRye Reactive Messaging
    - Quarkus uses build-time CDI: ensure all injection points are
      resolvable at build time
status:
  contentSize: 610
  ready: true
