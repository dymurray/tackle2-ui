apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: commit-conventions
  namespace: konveyor-tackle
spec:
  type: rule
  description: >
    Rule: Follow conventional commit message format and make
    atomic, well-scoped commits.
  version: "1.0.0"
  tags:
    - quality
    - git
  content: |
    # Rule: Commit Conventions

    Follow these commit conventions for all changes:

    - Use conventional commit format: `type(scope): description`
    - Types: feat, fix, refactor, chore, docs, test
    - Each commit should be atomic — one logical change per commit
    - Write a brief body explaining WHY, not just WHAT
    - Example: `refactor(imports): migrate javax.servlet to jakarta.servlet`
