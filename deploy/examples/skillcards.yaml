apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: javax-to-jakarta-imports
  namespace: konveyor-tackle
spec:
  type: skill
  description: >
    Transform Java source files from javax.* imports to their
    jakarta.* equivalents. Handles package renames across the
    full Jakarta EE 10 specification.
  version: "1.0.0"
  tags:
    - migration
    - java
    - jakarta
  globs:
    - "**/*.java"
  content: |
    # javax to jakarta Import Migration

    Transform all Java source files to replace `javax.*` imports
    with their `jakarta.*` equivalents.

    ## Rules
    - `javax.servlet.*` → `jakarta.servlet.*`
    - `javax.persistence.*` → `jakarta.persistence.*`
    - `javax.enterprise.*` → `jakarta.enterprise.*`
    - `javax.ws.rs.*` → `jakarta.ws.rs.*`
    - `javax.inject.*` → `jakarta.inject.*`
    - `javax.annotation.*` → `jakarta.annotation.*`
    - `javax.transaction.*` → `jakarta.transaction.*`
    - `javax.validation.*` → `jakarta.validation.*`
    - `javax.json.*` → `jakarta.json.*`

    ## Important
    - Do NOT change `javax.sql.*` — this is part of the JDK, not Jakarta EE
    - Do NOT change `javax.crypto.*` or `javax.net.*` — JDK packages
    - Update both import statements and fully-qualified class references
    - Run `mvn compile` after changes to verify
status:
  contentSize: 720
  ready: true
