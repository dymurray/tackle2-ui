apiVersion: konveyor.io/v1alpha1
kind: SkillCard
metadata:
  name: always-run-tests
  namespace: konveyor-tackle
spec:
  type: rule
  description: >
    Rule: Always run the project's test suite after making code
    changes. Never commit code that doesn't pass tests.
  version: "1.0.0"
  tags:
    - quality
    - testing
  content: |
    # Rule: Always Run Tests

    After making ANY code change, you MUST run the project's test
    suite before considering the change complete.

    - For Maven projects: `mvn test`
    - For Gradle projects: `gradle test`
    - If tests fail, fix the failures before moving on
    - Never commit code with failing tests
    - If a test is flaky, note it but do not delete it
