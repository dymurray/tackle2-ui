apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: konveyor-agentic-admin
rules:
  - apiGroups:
      - konveyor.io
    resources:
      - skillcards
      - skillcollections
      - llmproviders
      - agents
      - agentplans
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - konveyor.io
    resources:
      - skillcards/status
      - skillcollections/status
      - llmproviders/status
      - agents/status
      - agentplans/status
    verbs:
      - get
      - update
      - patch
