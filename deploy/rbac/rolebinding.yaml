# Binds the agentic admin role to the tackle-ui service account.
# The namespace for the service account subject is set via kustomize.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konveyor-agentic-admin-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: konveyor-agentic-admin
subjects:
  - kind: ServiceAccount
    name: tackle-ui
    namespace: konveyor-tackle
